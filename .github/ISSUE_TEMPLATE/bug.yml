name: Bug report
description: Report a bug in the retina RTSP library. For a problem with one camera or RTSP server, use the interop form instead.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is public. Do not include camera passwords, RTSP URLs with credentials, or addresses you do not want published.

        A vulnerability in retina must be reported privately from the repository's **Security** tab.
  - type: dropdown
    id: kind
    attributes:
      label: Problem
      options:
        - Panic or crash
        - Incorrect parsing or depacketization
        - Connection, session, or transport problem
        - API behaves differently from its documentation
        - Build or compile problem
        - Performance problem
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: retina version or commit
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Rust toolchain and OS
      description: The output of `rustc --version`, and the target OS and architecture.
    validations:
      required: true
  - type: input
    id: peer
    attributes:
      label: RTSP peer
      description: Camera or server make, model, and firmware version, if the problem involves one.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: If possible, a command using the example client, for example `cargo run --package client mp4 -- --url rtsp://192.0.2.10/ out.mp4`, or a minimal code sample.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized log output
      description: Run with `RUST_LOG=debug` if you can. Remove credentials and private addresses first.
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing open and closed issues for this problem.
          required: true
        - label: This report does not contain credentials or personal data.
          required: true
